type Item {
  id: ID!
  name: String!
  price: Float!
  category: String
  createdAt: String
}

type User {
  id: ID!
  username: String!
  email: String!
  role: String
}

type ItemConnection {
  items: [Item]
  scannedCount: Int
}

type Query {
  getItem(id: ID!): Item
  listItems: ItemConnection
  getUser(id: ID!): User
}

type Mutation {
  createItem(name: String!, price: Float!, category: String): Item
  deleteItem(id: ID!): Item
}

schema {
  query: Query
  mutation: Mutation
}
